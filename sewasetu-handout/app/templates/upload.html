
{% extends "base.html" %}
{% block content %}
<div class="steps"><b>Step 5 of 6:</b> Document Upload</div>

<h2>Upload Age Proof Document</h2>

<p class="note">
  Accepted documents: Birth certificate, School leaving certificate,
  Voter ID. Accepted formats: <b>PDF, JPG, JPEG or PNG.
  Maximum size: 5 MB.</b>
</p>

<form method="post" enctype="multipart/form-data">
  <label for="document">Select Document</label>
  <input
    type="file"
    id="document"
    name="document"
    accept=".pdf,.jpg,.jpeg,.png"
    required
  >
  <p><button class="btn" type="submit">Upload &amp; Continue</button></p>
</form>
{% endblock %}
